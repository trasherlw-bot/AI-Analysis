# Include inside the existing  server { ... }  next to the tracker include:
#   include /etc/nginx/snippets/hde-analysis.conf;

location = /hde-analysis {
    return 301 /hde-analysis/;
}

location /hde-analysis/ {
    # the trailing slash after 3003 removes the "/hde-analysis/" prefix before it reaches the app
    proxy_pass http://127.0.0.1:3003/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # overwrite (do not append) so nobody can fake their IP to dodge the login rate limit
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 30m;     # Excel uploads
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
